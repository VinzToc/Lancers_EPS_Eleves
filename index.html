<style id="titre-moderne">/* Titre en casse mixte + logo mis en valeur, aux couleurs du logo */
header h1{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-style:italic!important;font-weight:900!important;text-transform:none!important;letter-spacing:.005em!important;line-height:1.08;font-size:1.75rem!important;background:none!important;-webkit-text-stroke:0!important;color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:0 2px 0 #1c0b45,0 4px 12px rgba(0,0,0,.45)!important}

@media(max-width:520px){header h1{font-size:calc(1.75rem * .8)!important}}
